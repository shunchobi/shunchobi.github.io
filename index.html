<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shunichi Kondo</title>
<style>
  :root {
    --cream: #fbf7ee;
    --ink: #5a4636;
    --ink-mid: #6e5a44;
    --link: #c4442d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background-color: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                 "Noto Sans JP", "Segoe UI", sans-serif;
    line-height: 1.8;
  }
  main { max-width: 34rem; }
  h1 { margin: 0 0 24px; font-size: 1.25rem; font-weight: 700; }
  p { margin: 0 0 16px; }
  p.en { color: var(--ink-mid); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Shunichi Kondo</h1>
  <p lang="ja">
    ソリティア世界旅行 - 旅するクロンダイクの紹介ページは
    <a href="https://shunchobi.github.io/solitaire-world-tour-site/">こちら</a>です。
  </p>
  <p class="en" lang="en">
    The page for Solitaire World Tour is
    <a href="https://shunchobi.github.io/solitaire-world-tour-site/">here</a>.
  </p>
</main>
</body>
</html>
